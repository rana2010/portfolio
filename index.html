<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rana Ebrahim</title>
    <meta
      name="description"
      content="Rana Ebrahim is a product designer. Portfolio, selected work, and the Pulse case study."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..700;1,300..500&family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playball&family=Herr+Von+Muellerhoff&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Visit any page with #toggle-goatcounter to stop (or restart) counting this browser.
      // Handled here because GoatCounter skips it in manual (no_onload) mode.
      try {
        if (location.hash === "#toggle-goatcounter") {
          var off = localStorage.getItem("skipgc") === "t";
          if (off) localStorage.removeItem("skipgc");
          else localStorage.setItem("skipgc", "t");
          history.replaceState(null, "", location.pathname + location.search);
          setTimeout(function () {
            alert(off ? "GoatCounter will count this browser again." : "Done. GoatCounter will no longer count this browser.");
          }, 300);
        }
      } catch (e) {}
    </script>
    <script data-goatcounter="https://ranaebrahim.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
